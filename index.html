.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

<script>/* =====================================================================
   Motor de férias — regras da CLT (sem interface).
   Datas sempre em texto ISO "AAAA-MM-DD". Funções puras: o mesmo
   resultado no navegador e nos testes (Node).
   Referências: CLT arts. 130, 131, 133, 134, 135, 137, 139, 143, 145.
   ===================================================================== */
(function (root) {
  "use strict";

  // ---------- datas ----------
  const D = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const S = dt => dt.toISOString().slice(0, 10);
  const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return S(d); };
  const addYears = (s, n) => {
    const [y, m, d] = s.split("-").map(Number);
    const ny = y + n; const last = new Date(Date.UTC(ny, m, 0)).getUTCDate();
    return `${ny}-${String(m).padStart(2, "0")}-${String(Math.min(d, last)).padStart(2, "0")}`;
  };
  const diff = (a, b) => Math.round((D(b) - D(a)) / 864e5);            // b - a, em dias
  const weekday = s => D(s).getUTCDay();
  const overlap = (a1, a2, b1, b2) => { const i = a1 > b1 ? a1 : b1, f = a2 < b2 ? a2 : b2; return i <= f ? diff(i, f) + 1 : 0; };
  const fmt = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "";

  // ---------- configuração padrão (editável por empresa) ----------
  const CONFIG_PADRAO = {
    dsr: [0],                    // dias de repouso semanal (0 = domingo)
    diasAvisoLegal: 30,          // CLT art. 135
    antecedenciaProgramar: 90,   // alerta "programar férias" começa X dias antes do último dia para avisar
    antecedenciaAviso: 15,       // alerta "avisar colaborador" começa X dias antes do prazo de aviso
    antecedenciaSaida: 30,       // lista "vai sair de férias" nos próximos X dias
    antecedenciaPagamento: 7,    // alerta "pagamento" X dias antes do prazo do art. 145
    maxAusenciaPct: 0.3,         // cobertura: máximo da equipe ausente ao mesmo tempo
  };

  // ---------- R02: dias de direito pelas faltas (art. 130) ----------
  function diasPorFaltas(faltas) {
    if (faltas <= 5) return 30;
    if (faltas <= 14) return 24;
    if (faltas <= 23) return 18;
    if (faltas <= 32) return 12;
    return 0;
  }

  const ATIVOS = p => p.status !== "cancelada";
  const statusProg = (p, hoje) => p.status === "cancelada" ? "cancelada" : p.fim < hoje ? "realizada" : p.inicio <= hoje ? "em_gozo" : "programada";

  // ---------- R01, R04, R13, R14: períodos do colaborador ----------
  function calcularPeriodos(colab, ausencias, programacoes, hoje) {
    const out = [];
    if (!colab || !colab.admissao) return out;
    const limite = colab.desligamento && colab.desligamento < hoje ? colab.desligamento : hoje;
    const progs = (programacoes || []).filter(ATIVOS);
    const aus = ausencias || [];
    for (let k = 0; k < 80; k++) {
      const ini = addYears(colab.admissao, k);
      if (ini > limite) break;
      const fimAq = addDays(addYears(colab.admissao, k + 1), -1);
      const fimConc = addDays(addYears(colab.admissao, k + 2), -1);
      const range = (a) => overlap(ini, fimAq, a.inicio, a.fim || a.inicio);
      const faltas = aus.filter(a => a.tipo === "falta").reduce((t, a) => t + range(a), 0);
      const licRem = aus.filter(a => a.tipo === "licenca_remunerada").reduce((t, a) => t + range(a), 0);
      const inss = aus.filter(a => a.tipo === "inss").reduce((t, a) => t + range(a), 0);
      const direito = diasPorFaltas(faltas);
      const meus = progs.filter(p => p.periodo === ini);
      const usados = meus.reduce((t, p) => t + (+p.dias || 0) + (+p.abono || 0), 0);
      const gozados = meus.filter(p => p.fim < hoje).reduce((t, p) => t + (+p.dias || 0) + (+p.abono || 0), 0);
      const quitadoManual = colab.ferias_quitadas_ate && fimAq <= colab.ferias_quitadas_ate;
      const saldo = quitadoManual ? 0 : Math.max(0, direito - usados);
      const validar = [];
      if (licRem > 30) validar.push(`Licença remunerada de ${licRem} dias no período: pode haver perda do direito e novo período aquisitivo (CLT art. 133, II). Validar com o departamento pessoal.`);
      if (inss > 180) validar.push(`${inss} dias de afastamento previdenciário no período: pode haver perda do direito (CLT art. 133, IV). Validar com o departamento pessoal.`);
      if (faltas > 32) validar.push(`${faltas} faltas injustificadas: sem direito a férias neste período (CLT art. 130).`);
      let status;
      if (fimAq >= hoje) status = "em_aquisicao";
      else if (quitadoManual || (direito > 0 && saldo === 0 && gozados >= usados)) status = "quitado";
      else if (direito > 0 && saldo === 0) status = "programado";     // tudo marcado, mas ainda não gozado
      else if (direito === 0) status = "sem_direito";
      else if (fimConc < hoje) status = "vencido";
      else status = "a_vencer";
      const naoProgramado = status === "a_vencer" || status === "vencido" ? saldo : 0;
      const limiteInicio = naoProgramado ? addDays(fimConc, -naoProgramado + 1) : null;
      const limiteAviso = limiteInicio ? addDays(limiteInicio, -CONFIG_PADRAO.diasAvisoLegal) : null;
      out.push({ n: k + 1, aquisitivoInicio: ini, aquisitivoFim: fimAq, concessivoInicio: addDays(fimAq, 1), concessivoFim: fimConc,
        faltas, licencaRemunerada: licRem, afastamentoInss: inss, direito, usados, gozados, saldo, quitadoManual: !!quitadoManual,
        status, validar, limiteInicio, limiteAviso, programacoes: meus.map(p => p.id) });
    }
    return out;
  }

  // ---------- R06: início proibido nos 2 dias antes de feriado ou DSR (art. 134 §3º) ----------
  function inicioProibido(data, feriados, cfg) {
    const dsr = (cfg && cfg.dsr) || CONFIG_PADRAO.dsr;
    const set = new Set(feriados || []);
    for (const k of [1, 2]) { const d = addDays(data, k); if (set.has(d) || dsr.includes(weekday(d))) return d; }
    return null;
  }

  // ---------- validação de uma programação (R05, R06, R07, R09, R11) ----------
  // Retorna { erros: [...] que bloqueiam, avisos: [...] que exigem justificativa }
  function validarProgramacao(prog, ctx) {
    const { colab, periodos, programacoes, feriados, hoje } = ctx; const cfg = Object.assign({}, CONFIG_PADRAO, ctx.config || {});
    const erros = [], avisos = [];
    const dias = +prog.dias || 0, abono = +prog.abono || 0;
    if (!prog.inicio) erros.push("Informe a data de início.");
    if (dias < 1) erros.push("Informe a quantidade de dias.");
    const per = periodos.find(p => p.aquisitivoInicio === prog.periodo);
    if (!per) { erros.push("Escolha o período aquisitivo."); return { erros, avisos }; }
    if (erros.length) return { erros, avisos };
    const fim = addDays(prog.inicio, dias - 1);
    if (per.direito === 0) erros.push("Este período não dá direito a férias (CLT art. 130).");
    const outras = (programacoes || []).filter(p => ATIVOS(p) && p.id !== prog.id);
    const doPeriodo = outras.filter(p => p.periodo === prog.periodo);
    const usados = doPeriodo.reduce((t, p) => t + (+p.dias || 0) + (+p.abono || 0), 0);
    const disponivel = per.direito - usados;
    if (dias + abono > disponivel) erros.push(`Saldo insuficiente: ${disponivel} dias disponíveis neste período.`);
    // abono: até 1/3 (art. 143)
    if (abono > Math.floor(per.direito / 3)) erros.push(`Abono pecuniário limitado a ${Math.floor(per.direito / 3)} dias (1/3 do período, CLT art. 143).`);
    if (abono > 0 && doPeriodo.some(p => +p.abono > 0)) erros.push("O abono deste período já foi registrado.");
    // sobreposição com outras férias do colaborador
    for (const p of outras) if (overlap(prog.inicio, fim, p.inicio, p.fim)) erros.push(`Conflita com férias já registradas de ${fmt(p.inicio)} a ${fmt(p.fim)}.`);
    // fracionamento (art. 134 §1º)
    const partes = doPeriodo.map(p => +p.dias).concat([dias]);
    const restante = per.direito - usados - dias - abono;
    if (partes.length > 3) erros.push("Máximo de 3 períodos de gozo por período aquisitivo (CLT art. 134, §1º).");
    if (per.direito - abono >= 14) {
      if (partes.some(x => x < 5)) erros.push("Cada parte das férias deve ter no mínimo 5 dias corridos (CLT art. 134, §1º).");
      const tem14 = partes.some(x => x >= 14);
      const vagas = 3 - partes.length;
      if (!tem14 && (restante < 14 || vagas < 1)) erros.push("Uma das partes precisa ter no mínimo 14 dias corridos (CLT art. 134, §1º).");
      if (restante > 0 && restante < 5 && vagas >= 0) erros.push(`Sobrariam ${restante} dia(s), menos que o mínimo de 5 para uma parte.`);
    } else if (partes.length > 1 || restante > 0) {
      avisos.push("Período com menos de 14 dias de direito: o fracionamento não atende à regra de 14 + 5 dias. Validar com o departamento pessoal.");
    }
    if ((partes.length > 1 || restante > 0) && !prog.concordancia && !prog.coletiva) erros.push("Férias fracionadas exigem a concordância do colaborador (CLT art. 134, §1º). Marque a concordância.");
    // início proibido (art. 134 §3º)
    const proib = inicioProibido(prog.inicio, feriados, cfg);
    if (proib) erros.push(`Início não permitido: faltam menos de 2 dias para feriado ou repouso semanal (${fmt(proib)}) (CLT art. 134, §3º).`);
    // direito adquirido
    if (prog.inicio <= per.aquisitivoFim) avisos.push(`Início antes de completar o período aquisitivo (${fmt(per.aquisitivoFim)}): férias antecipadas. Validar com o departamento pessoal.`);
    // fora do concessivo (art. 137)
    if (fim > per.concessivoFim) avisos.push(`Termina depois do fim do período concessivo (${fmt(per.concessivoFim)}): férias devidas em dobro (CLT art. 137).`);
    // aviso com 30 dias (art. 135)
    if (hoje && diff(hoje, prog.inicio) < cfg.diasAvisoLegal && prog.inicio >= hoje) avisos.push(`Início em menos de ${cfg.diasAvisoLegal} dias: o aviso por escrito deve ter ${cfg.diasAvisoLegal} dias de antecedência (CLT art. 135).`);
    if (colab && colab.desligamento && prog.inicio > colab.desligamento) erros.push("Colaborador desligado antes do início.");
    return { erros, avisos, fim };
  }

  // ---------- cobertura da equipe (planejamento) ----------
  // equipes: [{id, nome, min_presentes}] ; colabs ativos com equipe_id ; progs ativas
  function conflitosCobertura(colabs, programacoes, equipes, cfg0, de, ate) {
    const cfg = Object.assign({}, CONFIG_PADRAO, cfg0 || {});
    const out = [];
    for (const eq of equipes) {
      // com mínimo de presentes definido, contam também as pessoas das equipes de dentro (ex.: setor com equipes)
      const temMin = eq.min_presentes != null && eq.min_presentes !== "";
      const membros = colabs.filter(c => (c.equipe_id === eq.id || (temMin && (c.unidades || []).includes(eq.id))) && c.situacao !== "desligado");
      if (membros.length < 2) continue;
      const ids = new Set(membros.map(c => c.id));
      const ps = programacoes.filter(p => ATIVOS(p) && ids.has(p.colaborador_id) && p.fim >= de && p.inicio <= ate);
      if (ps.length < 2) continue;
      const limite = eq.min_presentes != null && eq.min_presentes !== "" ? Math.max(0, membros.length - +eq.min_presentes) : Math.max(1, Math.floor(membros.length * cfg.maxAusenciaPct));
      let atual = null;
      const dias = new Set(); ps.forEach(p => { dias.add(p.inicio < de ? de : p.inicio); });
      // varre dia a dia apenas no intervalo coberto pelas programações
      const ini = ps.reduce((m, p) => p.inicio < m ? p.inicio : m, ate), fimMax = ps.reduce((m, p) => p.fim > m ? p.fim : m, de);
      for (let d = ini < de ? de : ini; d <= (fimMax > ate ? ate : fimMax); d = addDays(d, 1)) {
        const fora = ps.filter(p => p.inicio <= d && p.fim >= d);
        if (fora.length > limite) {
          const chave = fora.map(p => p.id).sort().join(",");
          if (atual && atual.chave === chave && addDays(atual.fim, 1) === d) atual.fim = d;
          else { atual = { equipe_id: eq.id, equipe: eq.nome, inicio: d, fim: d, chave, ausentes: fora.length, membros: membros.length, limite, programacoes: fora.map(p => p.id) }; out.push(atual); }
        } else atual = null;
      }
    }
    return out.map(c => { delete c.chave; return c; });
  }

  // sugestão: primeira data (até 180 dias depois) sem conflito, dentro do concessivo e com início permitido
  function sugerirNovaData(prog, ctx) {
    const { colabs, programacoes, equipes, feriados, periodo, config } = ctx;
    const dias = +prog.dias;
    for (let k = 1; k <= 180; k++) {
      const ini = addDays(prog.inicio, k), fim = addDays(ini, dias - 1);
      if (periodo && periodo.concessivoFim >= prog.inicio && fim > periodo.concessivoFim) return null; // já vencidas: sugere a primeira data livre
      if (inicioProibido(ini, feriados, config)) continue;
      const teste = programacoes.map(p => p.id === prog.id ? Object.assign({}, p, { inicio: ini, fim }) : p);
      const eq = equipes.filter(e => e.id === ctx.equipe_id);
      if (!conflitosCobertura(colabs, teste, eq, config, ini, fim).some(c => c.programacoes.includes(prog.id))) return { inicio: ini, fim };
    }
    return null;
  }

  // ---------- alertas ----------
  function nivelPorPrazo(dias) { return dias < 0 ? "critico" : dias <= 15 ? "critico" : dias <= 45 ? "alto" : "atencao"; }
  function gerarAlertas(dados, hoje, cfg0) {
    const cfg = Object.assign({}, CONFIG_PADRAO, cfg0 || {});
    const { colaboradores, ausencias, programacoes, equipes } = dados;
    const A = [];
    for (const c of colaboradores) {
      if (c.situacao === "desligado") continue;
      if (!c.admissao) { A.push({ key: `cad:${c.id}`, tipo: "administrativo", nivel: "atencao", colaborador_id: c.id, titulo: "Cadastro incompleto", detalhe: "Sem data de admissão: os períodos de férias não podem ser calculados.", prazo: null }); continue; }
      if (!c.equipe_id && !c.unidade_id) A.push({ key: `cadeq:${c.id}`, tipo: "administrativo", nivel: "atencao", colaborador_id: c.id, titulo: "Sem equipe ou setor", detalhe: "O colaborador não entra na análise de cobertura.", prazo: null });
      const ps = programacoes.filter(p => p.colaborador_id === c.id);
      const per = calcularPeriodos(c, ausencias.filter(a => a.colaborador_id === c.id), ps, hoje);
      for (const p of per) {
        p.validar.forEach((v, i) => A.push({ key: `val:${c.id}:${p.aquisitivoInicio}:${i}`, tipo: "legal", nivel: "alto", colaborador_id: c.id, titulo: "Validação necessária", detalhe: v, prazo: null, base: "CLT art. 130/133" }));
        if (p.status === "vencido") {
          A.push({ key: `venc:${c.id}:${p.aquisitivoInicio}`, tipo: "legal", nivel: "critico", colaborador_id: c.id, titulo: "Férias vencidas", detalhe: `Período ${fmt(p.aquisitivoInicio)} a ${fmt(p.aquisitivoFim)}: ${p.saldo} dias não concedidos até ${fmt(p.concessivoFim)}. Férias devidas em dobro.`, prazo: p.concessivoFim, base: "CLT art. 137" });
        } else if (p.status === "a_vencer" && p.saldo > 0) {
          const ate = diff(hoje, p.limiteAviso);
          if (ate <= cfg.antecedenciaProgramar) A.push({ key: `prog:${c.id}:${p.aquisitivoInicio}`, tipo: "legal", nivel: nivelPorPrazo(ate), colaborador_id: c.id, titulo: "Programar férias",
            detalhe: `${p.saldo} dias sem programação. Para não vencer: avisar até ${fmt(p.limiteAviso)} e iniciar até ${fmt(p.limiteInicio)} (concessivo termina em ${fmt(p.concessivoFim)}).`, prazo: p.limiteAviso, base: "CLT arts. 134, 135 e 137" });
        }
      }
      for (const p of ps.filter(ATIVOS)) {
        const st = statusProg(p, hoje); if (st !== "programada") continue;
        const prazoAviso = addDays(p.inicio, -cfg.diasAvisoLegal);
        const dAviso = diff(hoje, prazoAviso);
        if (!p.aviso_em && dAviso <= cfg.antecedenciaAviso) A.push({ key: `aviso:${p.id}`, tipo: "legal", nivel: nivelPorPrazo(dAviso), colaborador_id: c.id, titulo: dAviso < 0 ? "Aviso de férias atrasado" : "Avisar o colaborador",
          detalhe: `Férias de ${fmt(p.inicio)} a ${fmt(p.fim)}. Aviso por escrito até ${fmt(prazoAviso)}.`, prazo: prazoAviso, base: "CLT art. 135" });
        const prazoPag = addDays(p.inicio, -2); const dPag = diff(hoje, prazoPag);
        if (!p.pagamento_ok && dPag <= cfg.antecedenciaPagamento) A.push({ key: `pag:${p.id}`, tipo: "legal", nivel: dPag < 0 ? "critico" : "alto", colaborador_id: c.id, titulo: "Pagamento das férias",
          detalhe: `Pagar até ${fmt(prazoPag)} (início em ${fmt(p.inicio)}). Combine com a folha.`, prazo: prazoPag, base: "CLT art. 145" });
        const dSai = diff(hoje, p.inicio);
        if (dSai <= cfg.antecedenciaSaida) A.push({ key: `saida:${p.id}`, tipo: "administrativo", nivel: "info", colaborador_id: c.id, titulo: "Vai sair de férias",
          detalhe: `Sai em ${fmt(p.inicio)} (em ${dSai} dia${dSai === 1 ? "" : "s"}) e volta em ${fmt(addDays(p.fim, 1))}. Organizar cobertura e trâmites.`, prazo: p.inicio });
      }
    }
    const ativos = colaboradores.filter(c => c.situacao !== "desligado");
    const conf = conflitosCobertura(ativos, programacoes.map(p => Object.assign({ fim: addDays(p.inicio, (+p.dias || 1) - 1) }, p)), equipes || [], cfg, hoje, addDays(hoje, 365));
    conf.forEach(k => A.push({ key: `cob:${k.equipe_id}:${k.inicio}`, tipo: "administrativo", nivel: "alto", colaborador_id: null, equipe_id: k.equipe_id, titulo: "Cobertura da equipe",
      detalhe: `${k.equipe}: ${k.ausentes} de ${k.membros} fora de ${fmt(k.inicio)} a ${fmt(k.fim)} (limite ${k.limite}).`, prazo: k.inicio, programacoes: k.programacoes }));
    const ordem = { critico: 0, alto: 1, atencao: 2, info: 3 };
    return A.sort((a, b) => ordem[a.nivel] - ordem[b.nivel] || (a.prazo || "9") .localeCompare(b.prazo || "9"));
  }

  const Motor = { CONFIG_PADRAO, diasPorFaltas, calcularPeriodos, validarProgramacao, inicioProibido, conflitosCobertura, sugerirNovaData, gerarAlertas, statusProg,
    util: { addDays, addYears, diff, fmt, weekday, overlap } };
  if (typeof module !== "undefined" && module.exports) module.exports = Motor; else root.Motor = Motor;
})(typeof window !== "undefined" ? window : globalThis);
</script>

const PAPEL = { admin: "Administrador(a)", gestor: "Gestor(a)", consulta: "Somente consulta" };

// ---------- utilidades de interface ----------
function toast(t, err) { const e = document.createElement("div"); e.className = "toast" + (err ? " err" : ""); e.setAttribute("role", "status"); e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 3200); }
function modal(html, onMount) { const bg = document.createElement("div"); bg.className = "modal-bg"; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(bg);
  const close = () => bg.remove(); bg.addEventListener("click", e => { if (e.target === bg) close(); }); bg.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  const f = bg.querySelector("input,select,textarea"); if (f) setTimeout(() => f.focus(), 30); if (onMount) onMount(bg, close); return close; }
function confirmar(texto, botao) { return new Promise(res => modal(`<h2>${esc(texto)}</h2><div class="foot"><button class="btn" data-close>Voltar</button><button class="btn warn" id="ok">${esc(botao || "Confirmar")}</button></div>`, (bg, close) => { bg.querySelector("#ok").onclick = () => { close(); res(true); }; bg.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => res(false))); })); }
function erroMsg(e) { const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/row-level security/i.test(m)) return "Sem permissão para esta ação.";
  if (/duplicate key/i.test(m) && /matricula/i.test(m)) return "Já existe colaborador com essa matrícula.";
  if (/duplicate key/i.test(m)) return "Registro duplicado.";
  if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if (/Email not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos antes de entrar.";
  if (/Password should be/i.test(m)) return "A senha precisa ter pelo menos 8 caracteres.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Verifique a internet.";
  if (/Error sending (confirmation|recovery|magic link)/i.test(m)) return "Não foi possível enviar o e-mail agora. Tente de novo em alguns minutos.";
  if (/rate limit|For security purposes|too many requests/i.test(m)) return "Muitas tentativas seguidas. Aguarde um minuto e tente de novo.";
  if (/User already registered/i.test(m)) return "Este e-mail já tem conta. Use Entrar ou Esqueci a senha.";
  if (/JWT expired|invalid JWT|Invalid Refresh Token/i.test(m)) return "Sua sessão expirou. Entre de novo.";
  if (/Já existem férias programadas/i.test(m)) return "Já existem férias programadas nessas datas para este colaborador.";
  return m; }
async function q(promise) { const { data, error } = await promise; if (error) throw error; return data; }
function logErro(msg, pagina) { try { if (sb && S.user) sb.from("erros_app").insert({ empresa_id: S.emp?.id || null, mensagem: String(msg).slice(0, 1000), pagina: pagina || location.hash, navegador: navigator.userAgent.slice(0, 200) }).then(() => {}); } catch (e) {} }
window.addEventListener("error", e => logErro(e.message + " @" + (e.filename || "") + ":" + (e.lineno || "")));
window.addEventListener("unhandledrejection", e => logErro("promise: " + (e.reason && e.reason.message || e.reason)));
const credit = () => `<div class="footer">${esc(CFG.nomeProduto || "Gestão de Férias")} · Desenvolvido por <b>${esc(CFG.desenvolvedor || "Leonardo Valdez")}</b></div>`;

// ---------- inicialização ----------
async function iniciar() {
  if (!CFG.supabaseUrl || CFG.supabaseUrl.startsWith("__") || !window.supabase) {
    $("#root").innerHTML = `<div class="auth"><div class="card"><img src="${LOGO}" alt="Croissant & Cia"><h1>Configuração pendente</h1><p>O aplicativo ainda não foi ligado ao banco de dados. Preencha <b>supabaseUrl</b> e <b>supabaseAnonKey</b> no início do arquivo index.html.</p>${credit()}</div></div>`; return; }
  if (/type=recovery/.test(location.hash) || /type=recovery/.test(location.search)) S.recovery = true;
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "PASSWORD_RECOVERY") { S.recovery = true; telaNovaSenha(); return; }
    if (ev === "SIGNED_OUT") { S.user = null; telaLogin(); }
  });
  const { data } = await sb.auth.getSession();
  if (S.recovery) { if (data.session) telaNovaSenha(); return; }
  if (data.session) await entrarSeguro(data.session.user); else telaLogin();
}
// abre o app sem nunca ficar preso em "Carregando…": sem internet oferece tentar de novo; sessão inválida volta para a entrada
async function entrarSeguro(user) {
  try { await aposLogin(user); }
  catch (e) { const m = erroMsg(e);
    if (/sessão expirou/.test(m) || (e && /PGRST30/.test(e.code || ""))) { try { await sb.auth.signOut(); } catch (x) {} S.user = null; telaLogin(["Sua sessão expirou. Entre de novo.", "err"]); return; }
    telaAuth(`<h1>Não foi possível carregar</h1><div class="msg err">${esc(m)}</div><p class="small muted">Verifique a internet e toque em “Tentar de novo”. Nenhum dado foi perdido.</p><button class="btn pri" id="bT">Tentar de novo</button><button class="btn" id="bS">Sair</button>`);
    $("#bT").onclick = () => entrarSeguro(user); $("#bS").onclick = sair; }
}

function telaAuth(inner) { $("#root").innerHTML = `<div class="auth"><section class="auth-hero" aria-hidden="true"><div class="auth-logo"><img src="${LOGO}" alt=""></div><p class="auth-frase">As férias da equipe no prazo, do aviso ao pagamento.</p><p class="auth-sub">Períodos, saldos e alertas calculados pelas regras da CLT.</p></section><div class="card"><img class="auth-logo-m" src="${LOGO}" alt="Croissant & Cia — Alimentando o Brasil com qualidade.">${inner}${credit()}</div></div>`; }

  telaAuth(`<h1>Gestão de Férias</h1><form id="fl" class="list" novalidate>
    ${msg ? `<div class="msg ${msg[1] || "info"}">${esc(msg[0])}</div>` : ""}

  $("#fl").onsubmit = async e => { e.preventDefault(); const b = e.target.querySelector("button"); b.disabled = true;
    try { const d = await q(sb.auth.signInWithPassword({ email: $("#le").value.trim(), password: $("#ls").value })); await aposLogin(d.user); }

  $("#bCad").onclick = telaCadastro; $("#bEsq").onclick = telaEsqueci;
}
function telaCadastro() {
  telaAuth(`<h1>Criar conta</h1><p class="small muted">Use o mesmo e-mail que foi liberado pela empresa.</p><form id="fc" class="list" novalidate>
    <label class="f" for="ce">E-mail<input id="ce" type="email" autocomplete="email" required></label>
    <label class="f" for="cs">Senha (mínimo 8 caracteres)<input id="cs" type="password" autocomplete="new-password" minlength="8" required></label>

      if (d.session) await aposLogin(d.user); else telaLogin(["Conta criada. Abra o e-mail de confirmação que enviamos e depois entre com sua senha.", "ok"]); }

}
function telaEsqueci() {
  telaAuth(`<h1>Recuperar senha</h1><form id="fr" class="list" novalidate><label class="f" for="re">E-mail<input id="re" type="email" required></label><div id="rm"></div><button class="btn pri" type="submit">Enviar link de recuperação</button></form><button class="btn sm" id="bV">Voltar</button>`);

function telaNovaSenha() {
  telaAuth(`<h1>Nova senha</h1><form id="fn" class="list" novalidate><label class="f" for="ns">Nova senha (mínimo 8)<input id="ns" type="password" minlength="8" autocomplete="new-password" required></label><div id="nm"></div><button class="btn pri" type="submit">Salvar nova senha</button></form>`);

async function sair() { await sb.auth.signOut(); S.user = null; S.emp = null; S.D = null; location.hash = ""; telaLogin(["Você saiu da sua conta.", "ok"]); }

async function aposLogin(user) {
  if (S.recovery) return;
  S.user = user;
  try { await sb.rpc("aceitar_convites"); } catch (e) {}
  S.plataforma = !!(await sb.rpc("is_plataforma")).data;
  const mem = await q(sb.from("membros").select("empresa_id,papel,ativo,empresas(id,nome,cnpj,config,ativo)").eq("user_id", user.id).eq("ativo", true));
  const todas = mem.filter(m => m.empresas).map(m => Object.assign({}, m.empresas, { papel: m.papel }));
  S.empresas = todas.filter(e => e.ativo !== false);
  if (!S.empresas.length && todas.length && !S.plataforma) {
    telaAuth(`<h1>Acesso suspenso</h1><p>O acesso da empresa <b>${esc(todas[0].nome)}</b> está suspenso no momento. Os dados continuam guardados.</p><p class="small muted">Fale com o suporte (Leonardo Valdez) para liberar. Depois, toque em “Verificar de novo”.</p><button class="btn pri" id="bR">Verificar de novo</button><button class="btn" id="bS">Sair</button>`);
    $("#bR").onclick = () => entrarSeguro(user); $("#bS").onclick = sair; return; }
  if (!S.empresas.length && !S.plataforma) {
    telaAuth(`<h1>Acesso aguardando liberação</h1><p>Sua conta (<b>${esc(user.email)}</b>) foi criada, mas ainda não está ligada a nenhuma empresa.</p><p class="small muted">Peça ao responsável para liberar este e-mail. Depois, toque em “Verificar de novo”.</p><button class="btn pri" id="bR">Verificar de novo</button><button class="btn" id="bS">Sair</button>`);
    $("#bR").onclick = () => entrarSeguro(user); $("#bS").onclick = sair; return; }
  let last = null; try { last = localStorage.getItem("ferias_emp"); } catch (e) {}
  const emp = S.empresas.find(e => e.id === last) || S.empresas[0];
  if (emp) await abrirEmpresa(emp.id); else { S.emp = null; render(); }
}
async function abrirEmpresa(id) {
  const e = S.empresas.find(x => x.id === id); S.emp = e; S.papel = e.papel; try { localStorage.setItem("ferias_emp", id); } catch (er) {}
  S.filtro = {}; await carregar(); if (!location.hash || location.hash === "#/tecnico" && !S.plataforma) location.hash = "#/painel"; render();
}

// ---------- dados ----------
async function carregar() {
  // o servidor entrega no máximo 1.000 linhas por consulta: busca em páginas até trazer tudo
  const id = S.emp.id; const sel = async (t, ordem, chave) => { const out = [];
    for (let de = 0; ; de += 1000) { let r = sb.from(t).select("*").eq("empresa_id", id); (ordem ? [ordem, chave] : [chave]).forEach(c => r = r.order(c));
      const d = await q(r.range(de, de + 999)); out.push(...d); if (d.length < 1000) return out; } };
  const [emp, unidades, colabs, aus, progs, feriados, tratados] = await Promise.all([
    q(sb.from("empresas").select("*").eq("id", id).single()), sel("unidades", "ordem", "id"), sel("colaboradores", "nome", "id"),
    sel("ausencias", null, "id"), sel("programacoes", "inicio", "id"), sel("feriados", "data", "id"), sel("alertas_tratados", null, "chave")]);
  Object.assign(S.emp, emp);
  S.D = { unidades, colabs, aus, progs, feriados, tratados };
  derivar();
}
function cfgEmp() { return Object.assign({}, Motor.CONFIG_PADRAO, (S.emp && S.emp.config) || {}); }
function derivar() {
  const D = S.D, hoje = hojeSP(), cfg = cfgEmp();
  const uni = new Map(D.unidades.map(u => [u.id, u]));
  const caminho = id => { const out = []; let u = uni.get(id), g = 0; while (u && g++ < 10) { out.unshift(u); u = uni.get(u.parent_id); } return out; };
  const depto = id => caminho(id)[0] || null;
  const nomeCaminho = id => caminho(id).map(u => u.nome).join(" › ");
  const feriados = D.feriados.map(f => f.data);
  const porColab = new Map(); D.colabs.forEach(c => porColab.set(c.id, { aus: [], progs: [] }));
  D.aus.forEach(a => porColab.get(a.colaborador_id)?.aus.push(a)); D.progs.forEach(p => porColab.get(p.colaborador_id)?.progs.push(p));
  const fichas = new Map();
  for (const c of D.colabs) { const x = porColab.get(c.id); const per = Motor.calcularPeriodos(c, x.aus, x.progs, hoje);
    const dep = depto(c.unidade_id);
    const emFerias = x.progs.some(p => p.status !== "cancelada" && p.inicio <= hoje && p.fim >= hoje);
    const afastHoje = x.aus.some(a => ["inss", "licenca_remunerada", "licenca_nao_remunerada", "outro"].includes(a.tipo) && a.inicio <= hoje && a.fim >= hoje);
    const pend = per.filter(p => (p.status === "a_vencer" || p.status === "vencido") && p.saldo > 0);
    const prox = pend.map(p => p.limiteAviso).sort()[0] || null;
    fichas.set(c.id, { c, per, aus: x.aus, progs: x.progs, dep, deptoId: dep ? dep.id : null, unidade: nomeCaminho(c.unidade_id), emFerias, afastado: c.situacao === "afastado" || afastHoje, pend, prox,
      saldo: per.filter(p => p.status !== "em_aquisicao").reduce((t, p) => t + p.saldo, 0), vencidos: per.filter(p => p.status === "vencido").length }); }
  const ativos = D.colabs.filter(c => c.situacao !== "desligado");
  const comCaminho = c => Object.assign({}, c, { equipe_id: c.unidade_id, unidades: caminho(c.unidade_id).map(u => u.id) });
  const alertas = Motor.gerarAlertas({ colaboradores: D.colabs.map(comCaminho), ausencias: D.aus, programacoes: D.progs,
    equipes: D.unidades.filter(u => u.ativo).map(u => ({ id: u.id, nome: nomeCaminho(u.id), min_presentes: u.min_presentes })) }, hoje, cfg);
  const trat = new Map(D.tratados.map(t => [t.chave, t]));
  S.X = { hoje, cfg, uni, caminho, depto, nomeCaminho, comCaminho, feriados, fichas, ativos, alertas, trat, abertos: alertas.filter(a => !trat.has(a.key)) };
}
const colabNome = id => S.X.fichas.get(id)?.c.nome || "—";
const progStatus = p => Motor.statusProg(p, S.X.hoje);
let ocupado = false;
async function salvar(fn, ok) { if (ocupado) return false; ocupado = true; document.body.classList.add("ocupado");
  try { await fn(); await carregar(); if (ok) toast(ok); render(); return true; } catch (e) { const m = erroMsg(e); toast(m, true); if (m === (e && e.message)) logErro(m); return false; } finally { ocupado = false; document.body.classList.remove("ocupado"); } }

// ---------- estrutura da página ----------
const ROTAS = [["painel", "Painel"], ["alertas", "Alertas"], ["colaboradores", "Colaboradores"], ["ferias", "Férias"], ["calendario", "Calendário"], ["planejamento", "Planejamento"], ["relatorios", "Relatórios"], ["estrutura", "Estrutura"], ["config", "Configurações"]];
function rota() { return (location.hash.replace(/^#\/?/, "").split("?")[0]) || "painel"; }
window.addEventListener("hashchange", () => { if (S.user) render(); });

  if (!S.user) return;
  const r = rota(); const rotas = S.emp ? ROTAS.slice() : []; if (S.plataforma) rotas.push(["tecnico", "Painel técnico"]);
  if (!S.emp && r !== "tecnico") { location.hash = "#/tecnico"; return; }

  const telas = { painel: vPainel, alertas: vAlertas, colaboradores: vColabs, ferias: vFerias, calendario: vCalendario, planejamento: vPlanejamento, relatorios: vRelatorios, estrutura: vEstrutura, config: vConfig, tecnico: vTecnico };
  const tela = (r === "tecnico" && S.plataforma) ? vTecnico : (S.emp && telas[r]) || vPainel;
  $("#root").innerHTML = `<div class="app"><aside class="side"><div class="logo"><img src="${LOGO}" alt="Croissant & Cia"></div>${empSel}
    <nav aria-label="Menu">${rotas.map(link).join("")}</nav>
    <div class="foot">${esc(S.user.email)}<br>${S.papel ? PAPEL[S.papel] : ""}<br><button class="btn sm" id="bSair" style="margin-top:6px">Sair</button><br><br>Desenvolvido por Leonardo Valdez</div></aside>
    <header class="top"><div class="row1"><img src="${LOGO}" alt="Croissant & Cia">${S.empresas.length > 1 ? empSel.replace('id="empSel"', 'id="empSel2"') : ""}<button class="btn sm" id="bSair2">Sair</button></div><nav class="mnav" aria-label="Menu">${rotas.map(link).join("")}</nav></header>
    <main><div class="wrap" id="tela"></div>${credit()}</main></div>`;
  ["#bSair", "#bSair2"].forEach(s => { const b = $(s); if (b) b.onclick = sair; });
  ["#empSel", "#empSel2"].forEach(s => { const e = $(s); if (e) e.onchange = () => abrirEmpresa(e.value); });
  try { tela($("#tela")); } catch (e) { $("#tela").innerHTML = `<div class="msg err">Erro ao montar a tela: ${esc(e.message)}</div>`; logErro(e.stack || e.message); }
}

// ---------- filtros comuns ----------
function filtroHTML(opts) { const F = S.filtro; const deps = S.D.unidades.filter(u => u.tipo === "departamento" && u.ativo);
  const subs = F.dep ? S.D.unidades.filter(u => u.ativo && u.id !== F.dep && S.X.caminho(u.id)[0]?.id === F.dep) : [];
  const ativos = [F.dep, F.busca, F.de, F.ate, F.tipoAl, F.nivel, F.verTrat === "1" ? 1 : "", F.sit && F.sit !== "ativos" ? 1 : "", F.stp && F.stp !== "ativas" ? 1 : ""].filter(Boolean).length;
  const aberto = window.innerWidth >= 900 || ativos || S.filtroAberto;
  return `<details class="fbox" ${aberto ? "open" : ""}><summary>Filtros${ativos ? ` <span class="pill p-info">${ativos} ativo(s)</span>` : ""}</summary><div class="filters">
  <label class="f" for="fDep">Departamento<select id="fDep"><option value="">Todos</option>${deps.map(d => `<option value="${d.id}" ${F.dep === d.id ? "selected" : ""}>${esc(d.nome)}</option>`).join("")}</select></label>
  <label class="f" for="fUni">Setor / equipe<select id="fUni" ${F.dep ? "" : "disabled"}><option value="">Todos</option>${subs.map(u => `<option value="${u.id}" ${F.uni === u.id ? "selected" : ""}>${esc(S.X.nomeCaminho(u.id).split(" › ").slice(1).join(" › "))}</option>`).join("")}</select></label>
  ${opts && opts.busca ? `<label class="f" for="fBusca">Buscar colaborador<input id="fBusca" value="${esc(F.busca || "")}" placeholder="Nome ou matrícula"></label>` : ""}
  ${opts && opts.periodo ? `<label class="f" for="fDe">De<input type="date" id="fDe" value="${F.de || ""}"></label><label class="f" for="fAte">Até<input type="date" id="fAte" value="${F.ate || ""}"></label>` : ""}
  ${opts && opts.extra || ""}</div></details>`; }
function ligarFiltros(root, rerender) { const F = S.filtro; const fb = root.querySelector(".fbox"); if (fb) fb.addEventListener("toggle", () => { S.filtroAberto = fb.open; });
  const on = (id, k, ev) => { const e = root.querySelector(id); if (e) e.addEventListener(ev || "change", () => { F[k] = e.value; if (k === "dep") F.uni = ""; rerender(); }); };
  on("#fDep", "dep"); on("#fUni", "uni"); on("#fDe", "de"); on("#fAte", "ate");
  const b = root.querySelector("#fBusca"); if (b) b.addEventListener("input", () => { F.busca = b.value; clearTimeout(b._t); b._t = setTimeout(() => { rerender(); const n = root.querySelector("#fBusca"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250); }); }
function passaFiltro(f) { const F = S.filtro;
  if (F.dep && f.deptoId !== F.dep) return false;
  if (F.uni && !S.X.caminho(f.c.unidade_id).some(u => u.id === F.uni)) return false;
  if (F.busca) { const t = F.busca.toLowerCase(); if (!(f.c.nome.toLowerCase().includes(t) || String(f.c.matricula).toLowerCase().includes(t))) return false; }
  return true; }
const fichasFiltradas = (incluirDesligados) => [...S.X.fichas.values()].filter(f => (incluirDesligados || f.c.situacao !== "desligado") && passaFiltro(f));
const kpi = (l, v, cls, d) => `<div class="kpi ${cls || ""}${+v === 0 ? " zero" : ""}"><div class="l">${l}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`;
function barras(itens, max) { max = max || Math.max(1, ...itens.map(i => i[1])); return `<div class="bars">${itens.map(([l, v, d]) => `<div class="bar"><span>${esc(l)}</span><span class="t"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span><span class="c">${v}${d ? "" : ""}</span></div>`).join("")}</div>`; }

// ---------- PAINEL ----------
function vPainel(el) {
  const fs = fichasFiltradas(); const hoje = S.X.hoje; const ids = new Set(fs.map(f => f.c.id));
  const progs = S.D.progs.filter(p => ids.has(p.colaborador_id) && p.status !== "cancelada");
  const ano = hoje.slice(0, 4);
  const al = S.X.abertos.filter(a => !a.colaborador_id || ids.has(a.colaborador_id));
  const prox90 = fs.filter(f => f.prox && U.diff(hoje, f.prox) <= 90);
  const deps = S.D.unidades.filter(u => u.tipo === "departamento" && u.ativo);
  const meses = []; for (let k = 0; k < 12; k++) { const d = new Date(Date.UTC(+hoje.slice(0, 4), +hoje.slice(5, 7) - 1 + k, 1)); const m = d.toISOString().slice(0, 7);
    meses.push([`${MESES[d.getUTCMonth()]}/${String(d.getUTCFullYear()).slice(2)}`, new Set(progs.filter(p => p.inicio.slice(0, 7) <= m && p.fim.slice(0, 7) >= m).map(p => p.colaborador_id)).size]); }
  const nHoje = fs.filter(f => f.emFerias).length, nCrit = al.filter(a => a.nivel === "critico").length;

  el.innerHTML = `<div class="head"><div><h1>Painel de férias</h1><p class="hero-frase">${frase}</p></div><span class="muted small">Dados de ${fmt(hoje)}</span></div>
  ${S.D.colabs.length ? "" : `<div class="msg info"><b>Comece por aqui:</b> confira a <a href="#/estrutura">estrutura de departamentos</a>, depois cadastre ou importe os <a href="#/colaboradores">colaboradores</a>. Os períodos, saldos e alertas são calculados automaticamente.</div>`}
  ${filtroHTML()}
  <div class="kpis">${kpi("Colaboradores", fs.length, "", `${fs.filter(f => f.c.situacao === "ativo" && !f.afastado).length} ativos`)}${kpi("Afastados", fs.filter(f => f.afastado).length, "kc-info")}${kpi("Em férias hoje", fs.filter(f => f.emFerias).length, "")}
  ${kpi("Com férias pendentes", fs.filter(f => f.pend.length).length, "kc-att", `${fs.reduce((t, f) => t + f.pend.reduce((s, p) => s + p.saldo, 0), 0)} dias de saldo`)}${kpi("Férias vencidas", fs.filter(f => f.vencidos).length, "kc-crit", "pagamento em dobro")}
  ${kpi("Programadas", progs.filter(p => progStatus(p) === "programada").length, "kc-info")}${kpi(`Realizadas em ${ano}`, progs.filter(p => progStatus(p) === "realizada" && p.inicio.startsWith(ano)).length, "")}
  ${kpi("Vencem em 90 dias", prox90.length, "kc-high", "prazo para avisar")}${kpi("Pendências críticas", al.filter(a => a.nivel === "critico").length, "kc-crit", `<a href="#/alertas">ver alertas</a>`)}</div>
  <div class="grid2"><div class="panel"><h2>Pessoas de férias por mês</h2><p class="small muted">Próximos 12 meses, pelas programações registradas.</p>${barras(meses)}</div>
  <div class="panel"><h2>Por departamento</h2><div class="scroll"><table><thead><tr><th>Departamento</th><th class="n">Pessoas</th><th class="n">Em férias</th><th class="n">Pendentes</th><th class="n">Vencidas</th></tr></thead><tbody>
  ${deps.map(d => { const x = fs.filter(f => f.deptoId === d.id); return `<tr class="click" tabindex="0" data-dep="${d.id}"><td>${esc(d.nome)}</td><td class="n">${x.length}</td><td class="n">${x.filter(f => f.emFerias).length}</td><td class="n">${x.filter(f => f.pend.length).length}</td><td class="n">${x.filter(f => f.vencidos).length}</td></tr>`; }).join("")}
  ${fs.some(f => !f.deptoId) ? `<tr><td class="muted">Sem departamento</td><td class="n">${fs.filter(f => !f.deptoId).length}</td><td></td><td></td><td></td></tr>` : ""}</tbody></table></div></div></div>
  <div class="panel"><div class="head"><h2>Próximos prazos</h2><a class="btn sm" href="#/alertas">Todos os alertas</a></div>

  ${fs.filter(f => f.prox).sort((a, b) => a.prox.localeCompare(b.prox)).slice(0, 12).map(f => { const dd = U.diff(hoje, f.prox); return `<tr class="click" tabindex="0" data-col="${f.c.id}"><td>${esc(f.c.nome)}</td><td>${esc(f.dep?.nome || "—")}</td><td class="n">${f.pend.reduce((s, p) => s + p.saldo, 0)}</td><td class="num">${fmt(f.prox)}</td><td>${f.vencidos ? `<span class="pill p-crit">Vencida</span>` : dd < 15 ? `<span class="pill p-crit">${dd} dias</span>` : dd < 45 ? `<span class="pill p-high">${dd} dias</span>` : `<span class="pill p-att">${dd} dias</span>`}</td></tr>`; }).join("") || `<tr><td colspan="5" class="muted">Nenhum prazo pendente.</td></tr>`}</tbody></table></div></div>`;
  ligarFiltros(el, () => vPainel(el));

  el.querySelectorAll("tr.click").forEach(r => r.onkeydown = e => { if (e.key === "Enter") r.click(); });

    <div class="row">${a.colaborador_id ? `<button class="btn sm" data-col="${a.colaborador_id}">Abrir colaborador</button>` : ""}${a.key.startsWith("cob:") ? `<a class="btn sm" href="#/planejamento">Ver planejamento</a>` : ""}${pode() ? (t ? `<button class="btn sm" data-reabrir="${esc(a.key)}">Reabrir</button>` : `<button class="btn sm pri" data-tratar="${esc(a.key)}">Marcar como tratado</button>`) : ""}</div></div>`; }).join("") || `<div class="msg ok">Nenhum alerta ${verTrat ? "tratado" : "em aberto"} com esses filtros.</div>`}</div>`;
  ligarFiltros(el, () => vAlertas(el));
  [["#fTipo", "tipoAl"], ["#fNiv", "nivel"], ["#fTrat", "verTrat"]].forEach(([s, k]) => el.querySelector(s).onchange = e => { F[k] = e.target.value; vAlertas(el); });
  el.querySelectorAll("[data-col]").forEach(b => b.onclick = () => fichaColab(b.dataset.col));

    (bg, close) => bg.querySelector("#ok").onclick = async () => { const nota = bg.querySelector("#tn").value.trim(); if (!nota) { toast("Descreva o que foi feito.", true); return; } close();

  el.innerHTML = `<div class="head"><h1>Estrutura da empresa</h1><div class="row">${pode() ? `<button class="btn pri" id="bDep">+ Departamento</button>` : ""}</div></div>
  <p class="small muted">Empresa › Departamento › Setor › Equipe › Colaborador. Tudo pode ser criado, renomeado, movido e inativado. Unidades inativas não aparecem nas listas, mas o histórico é mantido.</p>
  <label class="f inline"><input type="checkbox" id="fInat" ${mostrarInat ? "checked" : ""}> Mostrar inativos</label>
  <div class="panel tree"><ul>${filhos(null).map(no).join("") || `<li class="muted">Nenhum departamento.</li>`}</ul></div>`;

  if (!pode()) return;

  el.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const p = S.X.uni.get(b.dataset.add); formUnidade({ tipo: tipoFilho[p.tipo], parent_id: p.id }); });
  el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => formUnidade(S.X.uni.get(b.dataset.edit)));
  el.querySelectorAll("[data-ativo]").forEach(b => b.onclick = async () => { const u = S.X.uni.get(b.dataset.ativo);
    if (u.ativo && cont(u.id) && !(await confirmar(`${u.nome} tem ${cont(u.id)} colaborador(es). Inativar mesmo assim? Eles continuam cadastrados.`, "Inativar"))) return;
    await salvar(() => q(sb.from("unidades").update({ ativo: !u.ativo }).eq("id", u.id)), u.ativo ? "Inativado" : "Reativado"); });
}
function formUnidade(u) {
  const paiTipo = { setor: "departamento", equipe: "setor" }[u.tipo];
  const descendentes = id => { const out = new Set([id]); let mud = true; while (mud) { mud = false; S.D.unidades.forEach(x => { if (x.parent_id && out.has(x.parent_id) && !out.has(x.id)) { out.add(x.id); mud = true; } }); } return out; };
  const proibidos = u.id ? descendentes(u.id) : new Set();
  const pais = paiTipo ? S.D.unidades.filter(x => x.tipo === paiTipo && (x.ativo || x.id === u.parent_id) && !proibidos.has(x.id)) : [];
  modal(`<h2>${u.id ? "Editar" : "Novo(a)"} ${u.tipo}</h2><form id="fu" class="list" novalidate><label class="f" for="u-nome">Nome<input id="u-nome" required value="${esc(u.nome)}"></label>
  ${paiTipo ? `<label class="f" for="u-pai">Fica dentro de<select id="u-pai">${pais.map(p => `<option value="${p.id}" ${p.id === u.parent_id ? "selected" : ""}>${esc(S.X.nomeCaminho(p.id))}</option>`).join("")}</select></label>` : ""}
  ${u.tipo !== "departamento" ? `<label class="f" for="u-min">Mínimo de pessoas presentes (opcional)<input id="u-min" type="number" min="0" value="${u.min_presentes ?? ""}"></label>` : ""}
  <label class="f" for="u-ord">Ordem de exibição<input id="u-ord" type="number" value="${u.ordem ?? 0}"></label>
  <div class="foot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`, (bg, close) => {
    bg.querySelector("#fu").onsubmit = async e => { e.preventDefault(); const v = s => bg.querySelector(s)?.value;
      const row = { nome: v("#u-nome").trim(), ordem: +v("#u-ord") || 0 }; if (paiTipo) row.parent_id = v("#u-pai") || null; if (u.tipo !== "departamento") row.min_presentes = v("#u-min") === "" ? null : +v("#u-min");
      if (!row.nome) { toast("Informe o nome.", true); return; } if (paiTipo && !row.parent_id) { toast("Escolha onde fica.", true); return; }
      if (await salvar(() => u.id ? q(sb.from("unidades").update(row).eq("id", u.id)) : q(sb.from("unidades").insert(Object.assign({ empresa_id: S.emp.id, tipo: u.tipo }, row))), "Estrutura salva")) close(); }; });
}

// ---------- IMPORTAÇÃO ----------
const MODELO = [["nome", "matricula", "departamento", "setor", "equipe", "cargo", "admissao", "situacao", "ferias_quitadas_ate", "tipo_contrato"], ["Maria Exemplo", "1001", "Logística", "Motoristas", "", "Motorista", "15/03/2023", "ativo", "", "CLT"]];
function lerData(v) { if (v == null || v === "") return null; if (v instanceof Date && !isNaN(v)) return new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())).toISOString().slice(0, 10);
  if (typeof v === "number") { const d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return d.toISOString().slice(0, 10); }
  const s = String(v).trim(); let m;
  const real = iso => { const d = new Date(iso + "T00:00:00Z"); return !isNaN(d) && d.toISOString().slice(0, 10) === iso && +iso.slice(0, 4) >= 1900 ? iso : "invalida"; };
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return real(`${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`);
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return real(`${m[1]}-${m[2]}-${m[3]}`); return "invalida"; }
function importar() {
  modal(`<h2>Importar colaboradores</h2><p class="small">Planilha Excel (.xlsx) ou CSV com as colunas: <b>nome, matricula, departamento, setor, equipe, cargo, admissao, situacao, ferias_quitadas_ate, tipo_contrato</b>. Departamentos, setores e equipes que não existirem são criados. Matrículas repetidas não são duplicadas.</p>
  <div class="row"><button class="btn sm" id="iMod">Baixar planilha modelo</button></div>
  <label class="f" for="iArq">Arquivo<input id="iArq" type="file" accept=".xlsx,.xls,.csv"></label><label class="f inline"><input type="checkbox" id="iAtu"> Atualizar colaboradores que já existem (mesma matrícula)</label>
  <div id="iRes"></div><div class="foot"><button class="btn" data-close>Fechar</button><button class="btn pri" id="iOk" disabled>Importar</button></div>`, (bg, close) => {
    const b = s => bg.querySelector(s); let linhas = [];
    b("#iMod").onclick = () => { const ws = XLSX.utils.aoa_to_sheet(MODELO); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Colaboradores"); XLSX.writeFile(wb, "modelo-colaboradores.xlsx"); };
    b("#iArq").onchange = async () => { const f = b("#iArq").files[0]; if (!f) return;
      try { const ehTexto = /\.(csv|txt)$/i.test(f.name); // CSV: tudo como texto, para a data ser lida como dd/mm/aaaa (e não no formato americano)
        const wb = XLSX.read(await f.arrayBuffer(), { type: "array", cellDates: true, raw: ehTexto }); const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
        const norm = k => String(k).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
        const mapa = { nome: "nome", nomecompleto: "nome", matricula: "matricula", departamento: "departamento", setor: "setor", equipe: "equipe", cargo: "cargo", funcao: "cargo", admissao: "admissao", dataadmissao: "admissao", situacao: "situacao", feriasquitadasate: "ferias_quitadas_ate", tipocontrato: "tipo_contrato" };
        const existentes = new Map(S.D.colabs.map(c => [String(c.matricula).trim(), c])); const vistos = new Set();
        linhas = raw.map((r, i) => { const x = {}; for (const k in r) { const m = mapa[norm(k)]; if (m) x[m] = typeof r[k] === "string" ? r[k].trim() : r[k]; }
          x.linha = i + 2; x.erros = []; x.matricula = String(x.matricula ?? "").trim(); x.admissao = lerData(x.admissao); x.ferias_quitadas_ate = lerData(x.ferias_quitadas_ate);
          const sit = norm(x.situacao || "ativo"); x.situacao = sit.startsWith("desl") ? "desligado" : sit.startsWith("afast") ? "afastado" : "ativo";
          if (!x.nome || String(x.nome).length < 2) x.erros.push("nome vazio"); if (!x.matricula) x.erros.push("matrícula vazia");
          if (!x.admissao) x.erros.push("admissão vazia"); else if (x.admissao === "invalida") x.erros.push("admissão em formato inválido (use dd/mm/aaaa)"); else if (x.admissao > S.X.hoje) x.erros.push("admissão no futuro");
          if (x.ferias_quitadas_ate === "invalida") x.erros.push("ferias_quitadas_ate inválida");
          if (!x.departamento) x.erros.push("departamento vazio");
          if (vistos.has(x.matricula)) x.erros.push("matrícula repetida na planilha"); vistos.add(x.matricula);
          x.existe = existentes.get(x.matricula); return x; });
        const ok = linhas.filter(l => !l.erros.length); const novos = ok.filter(l => !l.existe).length, exist = ok.length - novos;
        b("#iRes").innerHTML = `<div class="msg ${ok.length ? "ok" : "err"}">${linhas.length} linha(s) lidas: <b>${novos}</b> novo(s), <b>${exist}</b> já cadastrado(s), <b>${linhas.length - ok.length}</b> com erro.</div>
        ${linhas.some(l => l.erros.length) ? `<div class="msg err"><b>Linhas com erro (não serão importadas):</b><ul>${linhas.filter(l => l.erros.length).slice(0, 30).map(l => `<li>Linha ${l.linha}: ${esc(l.erros.join(", "))}</li>`).join("")}</ul></div>` : ""}`;
        b("#iOk").disabled = !ok.length; }
      catch (e) { b("#iRes").innerHTML = `<div class="msg err">Não consegui ler o arquivo. Salve como .xlsx ou .csv e tente de novo.</div>`; } };
    b("#iOk").onclick = async () => { b("#iOk").disabled = true; const atualizar = b("#iAtu").checked; const ok = linhas.filter(l => !l.erros.length && (atualizar || !l.existe));
      try { const cache = new Map(S.D.unidades.map(u => [`${u.tipo}|${u.parent_id || ""}|${u.nome.toLowerCase()}`, u.id]));
        const garantir = async (tipo, nome, pai) => { if (!nome) return pai; const k = `${tipo}|${pai || ""}|${String(nome).toLowerCase()}`; if (cache.has(k)) return cache.get(k);
          const r = await q(sb.from("unidades").insert({ empresa_id: S.emp.id, tipo, nome: String(nome), parent_id: pai || null }).select("id").single()); cache.set(k, r.id); return r.id; };
        let ins = 0, upd = 0;
        for (const l of ok) { const dep = await garantir("departamento", l.departamento, null); const set = await garantir("setor", l.setor, dep); const eq = l.setor ? await garantir("equipe", l.equipe, set) : set;
          const row = { empresa_id: S.emp.id, nome: String(l.nome), matricula: l.matricula, unidade_id: eq, cargo: l.cargo ? String(l.cargo) : null, admissao: l.admissao, situacao: l.situacao, ferias_quitadas_ate: l.ferias_quitadas_ate || null, tipo_contrato: l.tipo_contrato ? String(l.tipo_contrato) : "CLT" };
          if (l.existe) { await q(sb.from("colaboradores").update(row).eq("id", l.existe.id)); upd++; } else { await q(sb.from("colaboradores").insert(row)); ins++; } }
        await carregar(); render(); b("#iRes").innerHTML = `<div class="msg ok">Importação concluída: ${ins} cadastrado(s), ${upd} atualizado(s).</div>`; toast("Importação concluída"); }
      catch (e) { b("#iRes").innerHTML += `<div class="msg err">Erro durante a importação: ${esc(erroMsg(e))}. O que já foi gravado foi mantido.</div>`; await carregar(); render(); } };
  });
}

  <div class="panel list"><h2>Backups e manutenção</h2><ul class="small"><li>Backup diário automático: Supabase → Database → Backups (plano Pro).</li><li>Atualizar o aplicativo: substituir o index.html publicado; os dados não são afetados.</li><li>Atualizar o banco: rodar o novo schema.sql no SQL Editor (o arquivo pode ser executado de novo sem apagar dados).</li><li>Logs técnicos: Supabase → Logs.</li></ul></div>`;
  try { const r = await q(sb.rpc("plataforma_clientes"));
    el.querySelector("#tRes").innerHTML = `<h2>Clientes</h2><div class="scroll"><table><thead><tr><th>Empresa</th><th>Situação</th><th class="n">Usuários</th><th class="n">Convites</th><th class="n">Colaboradores</th><th class="n">Férias programadas</th><th>Última atividade</th><th></th></tr></thead><tbody>
    ${r.map(x => `<tr><td><b>${esc(x.nome)}</b></td><td>${x.ativo ? `<span class="pill p-ok">Ativa</span>` : `<span class="pill p-crit">Bloqueada</span>`}</td><td class="n">${x.usuarios}${x.max_usuarios ? ` / ${x.max_usuarios}` : ""}</td><td class="n">${x.convites_pendentes}</td><td class="n">${x.colaboradores}</td><td class="n">${x.programacoes}</td><td>${x.ultima_atividade ? new Date(x.ultima_atividade).toLocaleString("pt-BR") : "—"}</td><td><button class="btn sm" data-ger="${x.empresa_id}">Gerenciar</button></td></tr>`).join("") || `<tr><td colspan="8" class="muted">Nenhuma empresa.</td></tr>`}</tbody></table></div>`;
    el.querySelectorAll("[data-ger]").forEach(b => b.onclick = () => gerenciarEmpresa(r.find(x => x.empresa_id === b.dataset.ger), () => vTecnico(el))); }
  catch (e) { el.querySelector("#tRes").innerHTML = `<div class="msg err">${esc(erroMsg(e))}</div>`; }
  try { const er = await q(sb.from("erros_app").select("*").order("em", { ascending: false }).limit(30));
    el.querySelector("#tErr").innerHTML = er.length ? `<div class="scroll"><table><tbody>${er.map(x => `<tr><td class="num">${new Date(x.em).toLocaleString("pt-BR")}</td><td>${esc(x.mensagem)}</td><td class="small muted">${esc(x.pagina || "")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Nenhum erro registrado.</p>`; }
  catch (e) { el.querySelector("#tErr").innerHTML = `<div class="msg err">${esc(erroMsg(e))}</div>`; }
  el.querySelector("#tCriar").onclick = async () => { const n = el.querySelector("#tN").value.trim(); if (n.length < 2) { toast("Informe o nome.", true); return; }
    try { await q(sb.rpc("plataforma_criar_empresa", { p_nome: n, p_cnpj: el.querySelector("#tC").value, p_email_admin: el.querySelector("#tE").value })); toast("Empresa criada"); await aposLogin(S.user); location.hash = "#/tecnico"; } catch (e) { toast(erroMsg(e), true); } };
}

// janela do proprietário para uma empresa: situação, limite, usuários e histórico (sem dados de colaboradores)
async function gerenciarEmpresa(x, atualizar) {
  const id = x.empresa_id; let us = [], at = [];
  try { [us, at] = await Promise.all([q(sb.rpc("plataforma_usuarios", { p_empresa: id })), q(sb.rpc("plataforma_atividades", { p_empresa: id, p_limite: 50 }))]); } catch (e) { toast(erroMsg(e), true); return; }
  const linhaU = u => `<tr><td>${esc(u.email || "")}</td><td>${u.situacao === "convite" ? PAPEL[u.papel] : `<select data-pp="${u.user_id}" aria-label="Perfil">${Object.entries(PAPEL).map(([k, v]) => `<option value="${k}" ${k === u.papel ? "selected" : ""}>${v}</option>`).join("")}</select>`}</td>
    <td>${u.situacao === "ativo" ? `<span class="pill p-ok">Ativo</span>` : u.situacao === "bloqueado" ? `<span class="pill p-crit">Bloqueado</span>` : `<span class="pill p-att">Convite</span>`}</td>
    <td class="small">${u.ultimo_acesso ? new Date(u.ultimo_acesso).toLocaleString("pt-BR") : "—"}</td>
    <td>${u.situacao === "convite" ? "" : `<button class="btn sm ${u.ativo ? "warn" : ""}" data-pb="${u.user_id}" data-ativo="${u.ativo}">${u.ativo ? "Bloquear" : "Desbloquear"}</button>`}</td></tr>`;
  const fechar = modal(`<h2>${esc(x.nome)}</h2>
    <div class="row"><span>${x.ativo ? `<span class="pill p-ok">Empresa ativa</span>` : `<span class="pill p-crit">Empresa bloqueada</span>`}</span><button class="btn ${x.ativo ? "warn" : "pri"}" id="gSit">${x.ativo ? "Bloquear empresa" : "Liberar empresa"}</button></div>
    <div class="filters"><label class="f" for="gLim">Limite de usuários (vazio = sem limite)<input id="gLim" type="number" min="1" value="${x.max_usuarios || ""}"></label><div style="align-self:end"><button class="btn" id="gLimOk">Salvar limite</button></div></div>
    <h3>Usuários</h3><div class="scroll"><table><thead><tr><th>E-mail</th><th>Perfil</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>${us.map(linhaU).join("") || `<tr><td colspan="5" class="muted">Nenhum usuário.</td></tr>`}</tbody></table></div>
    <div class="filters"><label class="f" for="iv">Liberar e-mail<input id="iv" type="email"></label><label class="f" for="ip">Perfil<select id="ip">${Object.entries(PAPEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label><div style="align-self:end"><button class="btn pri" id="ok">Liberar</button></div></div>
    <h3>Histórico recente</h3><p class="small muted" style="margin:0">Quem fez, quando e o quê. O conteúdo dos cadastros não aparece aqui (privacidade da cliente).</p>
    <div class="scroll"><table><thead><tr><th>Quando</th><th>Quem</th><th>O quê</th><th>Campos</th></tr></thead><tbody>${at.map(a => `<tr><td class="num">${new Date(a.em).toLocaleString("pt-BR")}</td><td>${esc(a.quem)}</td><td>${esc((ACAO_NOME[a.acao] || a.acao) + " · " + (TAB_NOME[a.tabela] || a.tabela))}</td><td class="small">${esc(campos(a.campos))}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">Sem atividade.</td></tr>`}</tbody></table></div>
    <div class="foot"><button class="btn" data-close>Fechar</button></div>`, (bg, close) => {
    const refaz = async msg => { toast(msg); close(); const r = await q(sb.rpc("plataforma_clientes")); const nx = r.find(z => z.empresa_id === id); atualizar(); if (nx) gerenciarEmpresa(nx, atualizar); };
    bg.querySelector("#gSit").onclick = async () => { if (!(await confirmar(x.ativo ? `Bloquear ${x.nome}? Ninguém da empresa consegue entrar até você liberar. Os dados ficam guardados.` : `Liberar o acesso de ${x.nome}?`, x.ativo ? "Bloquear" : "Liberar"))) return;
      try { await q(sb.rpc("plataforma_empresa", { p_empresa: id, p_ativo: !x.ativo, p_max_usuarios: x.max_usuarios })); refaz(x.ativo ? "Empresa bloqueada" : "Empresa liberada"); } catch (e) { toast(erroMsg(e), true); } };
    bg.querySelector("#gLimOk").onclick = async () => { const v = bg.querySelector("#gLim").value.trim(); if (v !== "" && (!Number.isInteger(+v) || +v < 1)) { toast("Informe um número inteiro a partir de 1, ou deixe vazio.", true); return; }
      try { await q(sb.rpc("plataforma_empresa", { p_empresa: id, p_ativo: x.ativo, p_max_usuarios: v === "" ? null : +v })); refaz("Limite salvo"); } catch (e) { toast(erroMsg(e), true); } };
    bg.querySelectorAll("[data-pp]").forEach(s2 => s2.onchange = async () => { const u = us.find(z => z.user_id === s2.dataset.pp);
      try { await q(sb.rpc("plataforma_definir_usuario", { p_empresa: id, p_user: u.user_id, p_papel: s2.value, p_ativo: u.ativo })); refaz("Perfil alterado"); } catch (e) { toast(erroMsg(e), true); } });
    bg.querySelectorAll("[data-pb]").forEach(b => b.onclick = async () => { const u = us.find(z => z.user_id === b.dataset.pb);
      if (u.ativo && !(await confirmar(`Bloquear o acesso de ${u.email}?`, "Bloquear"))) return;
      try { await q(sb.rpc("plataforma_definir_usuario", { p_empresa: id, p_user: u.user_id, p_papel: u.papel, p_ativo: !u.ativo })); refaz(u.ativo ? "Usuário bloqueado" : "Usuário desbloqueado"); } catch (e) { toast(erroMsg(e), true); } });
    bg.querySelector("#ok").onclick = async () => { try { const st = await q(sb.rpc("adicionar_usuario", { p_empresa: id, p_email: bg.querySelector("#iv").value, p_papel: bg.querySelector("#ip").value })); refaz(st === "vinculado" ? "Acesso liberado" : "Convite registrado"); } catch (e) { toast(erroMsg(e), true); } };
  });
}

iniciar();
})();
</script>
